name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install lefthook gitleaks shellcheck

      - name: Install web dependencies
        run: |
          for d in web/notam-relay web/charts web/interviews; do
            (cd "$d" && npm ci)
          done

      - name: Pre-commit checks
        run: tools/check.sh --quick

  unit-tests:
    name: unit-tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Build app and tests
        run: tools/sim-test.sh build -quiet

      - name: Run unit tests on the simulator
        env:
          RESULT: ${{ runner.temp }}/unit.xcresult
        run: tools/sim-test.sh test -only-testing:efb-212Tests

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-xcresult
          path: ${{ runner.temp }}/unit.xcresult
