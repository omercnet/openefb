name: CI

# Every change to main goes through a pull request; these jobs are its required checks (see docs/CI.md).
# The repo is public, so GitHub-hosted macOS minutes are free, but hosted macOS runners are scarce. No workflow path
# filters (a skipped required check never reports and would block the pull request); instead the `changes` job skips
# the Swift app's macOS jobs on pull requests that cannot affect it, and the gate accepts exactly that skip.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned: the app needs the iOS 26 SDK. macos-26 ships iOS 26.5 simulators with iPad Pro 13-inch (M5).
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  changes:
    name: Changed areas
    # Decides whether the Swift app's macOS jobs must run. A pull request whose every changed file is under app/
    # (the React Native app), docs/, web/ or tools/port/, or is app.yml, cannot change the Swift build or its scenario
    # runs, so unit-tests, simulation and build-release-xcode are skipped. Pushes to main and manual runs always run
    # everything; an empty or failed diff runs everything too.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0 # the diff needs the base and head commits
      - id: diff
        name: Does the change touch the Swift app?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo swift=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE...$HEAD")
          other=$(printf '%s\n' "$files" | grep -v -E '^(app/|docs/|web/|tools/port/|\.github/workflows/app\.yml$)' || true)
          if [ -n "$files" ] && [ -z "$other" ]; then swift=false; else swift=true; fi
          echo "swift=$swift"
          printf 'files that may affect the Swift app:\n%s\n' "${other:-(none)}"
          echo "swift=$swift" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the pull request's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks and the commit range need the history
      - name: Secret scan (pull request / push range)
        # Official gitleaks action with .gitleaks.toml: PR summary for the commits in this change. It walks first-parent
        # commits only, so the full-history scan in tools/check.sh below stays the gate.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_VERSION: "8.30.1" # same as mise below and the local hooks
      - name: Install lefthook and gitleaks
        # lefthook has no official setup action; mise (the repo's tool installer, tools/hooks/README.md) has one.
        uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            lefthook = "2.2.2"
            gitleaks = "8.30.1"
      - name: Install plistutil
        # libplist lints plists and project.pbxproj off macOS (tools/hooks/plist-lint.sh). shellcheck and python3 ship with the runner.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libplist-utils
      - name: Conventional Commits (pull requests)
        if: github.event_name == 'pull_request'
        run: tools/hooks/commit-msg.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Pre-commit checks over the whole tree, full-history secret scan
        # The web jobs cover web/*, the app job covers app/; swift-format is report-only (about 4,400 known findings).
        env:
          LEFTHOOK_EXCLUDE: web-interviews,web-relay,web-charts,web-ota,app,swift-format
        run: tools/check.sh

  web:
    name: Web (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: notam-relay
            commands: npm test && npm run typecheck
          - package: charts
            commands: npm test
          - package: ota
            commands: npm test && npm run typecheck
          - package: interviews
            commands: npm run lint
    defaults:
      run:
        working-directory: web/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.commands }}

  app:
    name: App (tsc, lint, jest)
    # The React Native app's Linux checks on every pull request, so the gate covers them (rn-rewrite-plan.md 6.1). The
    # device builds and captures stay in app.yml, which only runs when app/ or web/ota/ changes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  unit-tests:
    name: Unit tests (iPad simulator)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # GitHub-hosted macos-latest while the self-hosted Tart runners (label `tartelet`) are offline, with the image's
    # default Xcode (26.6 on macOS 26), so a move of the label to a newer image doesn't break the path.
    # To go back: runs-on fork PRs -> 'macos-26', else ["self-hosted", "macOS", "ARM64", "tartelet"] with
    # Xcode 27.2 (see docs/CI.md).
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Set at job level, before checkout: /usr/bin/git is an xcrun shim and fails on a missing DEVELOPER_DIR.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: /tmp/efb-dd-${{ github.event.repository.name }}/SourcePackages
          key: spm-${{ hashFiles('efb-212.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Test
        env:
          RESULT: ${{ runner.temp }}/unit-tests.xcresult
        run: |
          set -o pipefail
          tools/sim-test.sh test -only-testing:efb-212Tests 2>&1 | xcbeautify --renderer github-actions
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-xcresult
          path: ${{ runner.temp }}/unit-tests.xcresult
          retention-days: 7

  simulation:
    name: Flight scenarios (iPad simulator)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # GitHub-hosted macos-latest while the Tart runners are offline; see the unit-tests job.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Set at job level, before checkout: /usr/bin/git is an xcrun shim and fails on a missing DEVELOPER_DIR.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: /tmp/efb-dd-${{ github.event.repository.name }}/SourcePackages
          key: spm-${{ hashFiles('efb-212.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build the DEBUG app
        run: |
          set -o pipefail
          tools/sim-test.sh build 2>&1 | xcbeautify --renderer github-actions
      - name: Fly the scenarios
        env:
          OUT: ${{ runner.temp }}/scenarios
        run: tools/ci/fly-scenarios.sh
      - name: Capture the new screens
        env:
          OUT: ${{ runner.temp }}/scenarios/screens
        run: tools/ci/capture-screens.sh
      - name: Upload screenshots, logs and crash reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-captures
          path: ${{ runner.temp }}/scenarios
          retention-days: 7

  # Advisory: the PR jobs above build with Xcode 27.2 (the Tart image has no 26.6), while release.yml archives with
  # 26.6. This compiles the app and tests with 26.6 on a hosted runner so a 26.6-only error shows before a release.
  # Not in the gate: hosted macOS capacity runs out, and a cancelled job must not block merges.
  build-release-xcode:
    name: Build with the release Xcode (26.6, advisory)
    needs: changes
    if: >-
      needs.changes.outputs.swift == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Swift packages
        # On a fresh derived-data folder the build's own resolve fails ("Could not resolve package dependencies");
        # resolving first, unpiped, works and shows any real error.
        run: xcodebuild -resolvePackageDependencies -project efb-212.xcodeproj -scheme efb-212 -derivedDataPath "/tmp/efb-dd-${{ github.event.repository.name }}"
      - name: Build app and tests
        run: |
          set -o pipefail
          tools/sim-test.sh build 2>&1 | xcbeautify --renderer github-actions

  # The one required check: it passes only when every job above passed (the Swift jobs may also be skipped when
  # `changes` says the pull request cannot affect the Swift app), so job names can change without touching the
  # branch ruleset.
  gate:
    name: CI gate
    if: always()
    needs: [changes, lint, web, app, unit-tests, simulation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          SWIFT: ${{ needs.changes.outputs.swift }}
          REQUIRED: ${{ needs.changes.result }} ${{ needs.lint.result }} ${{ needs.web.result }} ${{ needs.app.result }}
          SWIFT_JOBS: ${{ needs.unit-tests.result }} ${{ needs.simulation.result }}
        run: |
          echo "required: $REQUIRED; Swift jobs: $SWIFT_JOBS (swift=$SWIFT)"
          for r in $REQUIRED; do [ "$r" = success ] || exit 1; done
          for r in $SWIFT_JOBS; do
            [ "$r" = success ] && continue
            [ "$SWIFT" = false ] && [ "$r" = skipped ] && continue
            exit 1
          done
