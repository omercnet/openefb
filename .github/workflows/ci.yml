name: CI

# Every change to main goes through a pull request; these jobs are its required checks (see docs/CI.md).
# The repo is public, so GitHub-hosted macOS minutes are free. No path filters: a skipped required check
# never reports and would block the pull request.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned: the app needs the iOS 26 SDK. macos-26 ships iOS 26.5 simulators with iPad Pro 13-inch (M5).
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  lint:
    name: Lint and secrets
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history scan and the commit range need it
      - name: Install hook tools
        run: brew install lefthook gitleaks shellcheck
      - name: Conventional Commits (pull requests)
        if: github.event_name == 'pull_request'
        run: tools/hooks/commit-msg.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Pre-commit checks over the whole tree
        # The web jobs cover web/*; swift-format is report-only (about 4,400 known findings).
        env:
          LEFTHOOK_EXCLUDE: web-interviews,web-relay,web-charts,swift-format
        run: tools/check.sh

  web:
    name: Web (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: notam-relay
            commands: npm test && npm run typecheck
          - package: charts
            commands: npm test
          - package: interviews
            commands: npm run lint
    defaults:
      run:
        working-directory: web/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.commands }}

  unit-tests:
    name: Unit tests (iPad simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: /tmp/efb-dd-${{ github.event.repository.name }}/SourcePackages
          key: spm-${{ hashFiles('efb-212.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Test
        env:
          RESULT: ${{ runner.temp }}/unit-tests.xcresult
        run: |
          set -o pipefail
          tools/sim-test.sh test -only-testing:efb-212Tests 2>&1 | xcbeautify --renderer github-actions
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests-xcresult
          path: ${{ runner.temp }}/unit-tests.xcresult
          retention-days: 7

  simulation:
    name: Flight scenarios (iPad simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: /tmp/efb-dd-${{ github.event.repository.name }}/SourcePackages
          key: spm-${{ hashFiles('efb-212.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Build the DEBUG app
        run: |
          set -o pipefail
          tools/sim-test.sh build 2>&1 | xcbeautify --renderer github-actions
      - name: Fly the scenarios
        env:
          OUT: ${{ runner.temp }}/scenarios
        run: tools/ci/fly-scenarios.sh
      - name: Upload screenshots, logs and crash reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-captures
          path: ${{ runner.temp }}/scenarios
          retention-days: 7

  # The one required check: it passes only when every job above passed, so job names can change
  # without touching the branch ruleset.
  gate:
    name: CI gate
    if: always()
    needs: [lint, web, unit-tests, simulation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
