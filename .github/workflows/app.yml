name: App

# Kanaf EFB React Native app (app/): Release builds for the iPad simulator and an Android tablet emulator,
# screenshots of each screen compared with the SwiftUI references, and the native self-test result.
# Build-and-capture only: nothing is signed for distribution, published or deployed. CI builds use the dev variant
# (KANAF_VARIANT=dev, io.omer.efb.dev) so they can never be confused with the production identity io.omer.efb.
# It also proves OTA updates (web/ota) end to end against `wrangler dev` on the runner (scripts/ota-smoke.sh): embedded
# launch, signed update A, tampered update B refused, roll back to embedded, other channel ignored. The signing keys are
# generated per run under /tmp and never leave the runner; nothing is deployed to Cloudflare.
# Runs only for pull requests that touch app/, web/ota/ or this file (not a required check: a path-filtered
# required check that never reports would block unrelated pull requests, see ci.yml). The same tsc, lint and jest run
# in ci.yml's app job, which is in the required gate; the checks job here is what the device builds wait for.
on:
  pull_request:
    paths:
      - app/**
      - web/ota/**
      - .github/workflows/app.yml
  workflow_dispatch:

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: Checks (tsc, lint, jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  ios:
    name: iOS (iPad simulator, Release)
    needs: checks # a failed check stops the long device builds
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Set at job level, before checkout: /usr/bin/git is an xcrun shim (see ci.yml). Same Xcode as ci.yml.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DD: /tmp/rn-dd
      OUT: /tmp/app-ios
      # OTA build config (app/app.config.ts): URL and certificate go into the binary, cleartext is allowed
      # for this smoke build only, and the embedded bundle carries the mark "embedded". Exports use mark A and B.
      KANAF_OTA_URL: http://127.0.0.1:8787/manifest
      KANAF_OTA_CERT: ./ota/certificate.pem
      KANAF_OTA_CHANNEL: ci
      KANAF_OTA_SMOKE: '1'
      KANAF_VARIANT: dev
      EXPO_PUBLIC_OTA_MARK: embedded
      KEYDIR: /tmp/ota-keys
    steps:
      - uses: actions/checkout@v7
      - name: Use the app's bundled aviation database (not committed)
        run: cp ../efb-212/Resources/aviation.sqlite assets/aviation.sqlite
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Generate ephemeral OTA signing keys (never committed)
        run: |
          for k in good bad; do
            npx expo-updates codesigning:generate --key-output-directory "$KEYDIR/$k" \
              --certificate-output-directory "$KEYDIR/$k-cert" --certificate-validity-duration-years 1 \
              --certificate-common-name "Kanaf CI $k"
          done
          mkdir -p ota
          cp "$KEYDIR/good-cert/certificate.pem" ota/certificate.pem
      - name: Prebuild (ios)
        run: npx expo prebuild -p ios --no-install --clean
      - name: Pod install
        working-directory: app/ios
        run: pod install
      - name: Build Release for the simulator (ad-hoc signed)
        # Ad-hoc ("Sign to Run Locally") signing, no team: an unsigned app (CODE_SIGNING_ALLOWED=NO) gets
        # errSecMissingEntitlement from the Keychain, which broke expo-secure-store in run 2.
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          xcodebuild build -workspace ios/KanafEFBDev.xcworkspace -scheme KanafEFBDev -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            </dev/null 2>&1 | tee "$OUT/build.log" | xcbeautify --renderer github-actions
      - name: Show the app's signature and entitlements
        run: |
          APP="$DD/Build/Products/Release-iphonesimulator/KanafEFBDev.app"
          { grep -E '^(CodeSign|ProcessProductPackaging).*KanafEFBDev' "$OUT/build.log" || echo "no CodeSign step for the app in the build log"
            codesign -dvv "$APP" 2>&1 || true
            echo "--- signed entitlements"; codesign -d --entitlements - --xml "$APP" 2>&1 || true
            echo "--- simulated entitlements (__TEXT,__entitlements)"
            xcrun otool -X -s __TEXT __entitlements "$APP/KanafEFBDev" 2>&1 | head -40 || true
          } | tee "$OUT/signing.txt"
      - name: OTA server, runtime version check and update exports
        id: ota_prep
        run: |
          set -euo pipefail
          mkdir -p "$OUT/ota"
          # The binary holds the sentinel file:fingerprint; the real value is EXUpdates.bundle/fingerprint
          # (expo-updates UpdatesConfig.swift reads it from there).
          FP=$(find "$DD/Build/Products/Release-iphonesimulator/KanafEFBDev.app" -path '*EXUpdates.bundle*' -name fingerprint | head -1)
          BIN=$(tr -d '[:space:]' < "${FP:?no EXUpdates.bundle/fingerprint in the app}")
          RES=$(npx expo-updates runtimeversion:resolve --platform ios | jq -r .runtimeVersion)
          echo "binary $BIN resolve $RES" | tee "$OUT/ota/runtime-version-check.txt"
          test -n "$BIN" && test "$BIN" = "$RES"
          echo "$BIN" > "$OUT/runtime-version.txt"
          for m in A B; do
            EXPO_PUBLIC_OTA_MARK=$m npx expo export --platform ios --output-dir "/tmp/ota-export-$m"
            # extra.expoClient in the manifest (Constants.expoConfig on an OTA launch), as Expo's reference server does
            npx expo config --json --type public > "/tmp/ota-export-$m/expoConfig.json"
          done
          npm --prefix ../web/ota ci
          cd ../web/ota
          nohup npx --no-install wrangler dev --port 8787 --ip 127.0.0.1 --local > "$OUT/ota/wrangler.log" 2>&1 &
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8787/health && exit 0; sleep 2; done
          cat "$OUT/ota/wrangler.log"; exit 1
      - name: Capture screens and self test
        env:
          APP: /tmp/rn-dd/Build/Products/Release-iphonesimulator/KanafEFBDev.app
        run: scripts/ios-capture.sh
      - name: OTA smoke (embedded, update, tampered update, rollback, other channel)
        if: always() && steps.ota_prep.outcome == 'success'
        env:
          PLATFORM: ios
          EXPORT_A: /tmp/ota-export-A
          EXPORT_B: /tmp/ota-export-B
        run: scripts/ota-smoke.sh
      - name: Compare with the SwiftUI references (fails below scripts/fidelity-thresholds.json)
        if: always()
        run: node scripts/compare.mjs --dir "$OUT/screens" --out "$OUT/compare" --json "$OUT/compare.json" --gate ios
      - name: Keep the build log tail
        if: always()
        run: tail -n 300 "$OUT/build.log" > "$OUT/build-tail.log" 2>/dev/null || true
      - name: Upload screens, results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-ios
          path: |
            /tmp/app-ios
            !/tmp/app-ios/build.log
          retention-days: 14

  android:
    name: Android (Pixel Tablet API 35 emulator, Release)
    needs: checks # a failed check stops the long device builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUT: /tmp/app-android
      # OTA build config (app/app.config.ts): URL and certificate go into the binary, cleartext is allowed
      # for this smoke build only, and the embedded bundle carries the mark "embedded". Exports use mark A and B.
      KANAF_OTA_URL: http://127.0.0.1:8787/manifest
      KANAF_OTA_CERT: ./ota/certificate.pem
      KANAF_OTA_CHANNEL: ci
      KANAF_OTA_SMOKE: '1'
      KANAF_VARIANT: dev
      EXPO_PUBLIC_OTA_MARK: embedded
      KEYDIR: /tmp/ota-keys
    steps:
      - uses: actions/checkout@v7
      - name: Use the app's bundled aviation database (not committed)
        run: cp ../efb-212/Resources/aviation.sqlite assets/aviation.sqlite
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Generate ephemeral OTA signing keys (never committed)
        run: |
          for k in good bad; do
            npx expo-updates codesigning:generate --key-output-directory "$KEYDIR/$k" \
              --certificate-output-directory "$KEYDIR/$k-cert" --certificate-validity-duration-years 1 \
              --certificate-common-name "Kanaf CI $k"
          done
          mkdir -p ota
          cp "$KEYDIR/good-cert/certificate.pem" ota/certificate.pem
      - name: Prebuild (android)
        run: npx expo prebuild -p android --no-install --clean
      - name: Build Release APK (signed with the template's debug keystore)
        working-directory: app/android
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$OUT/build.log"
      - name: OTA server, runtime version check and update exports
        id: ota_prep
        run: |
          set -euo pipefail
          mkdir -p "$OUT/ota"
          # The binary holds the sentinel file:fingerprint; the real value is a file next to the app code.
          BIN=$(unzip -p android/app/build/outputs/apk/release/app-release.apk assets/fingerprint | tr -d '[:space:]')
          RES=$(npx expo-updates runtimeversion:resolve --platform android | jq -r .runtimeVersion)
          echo "binary $BIN resolve $RES" | tee "$OUT/ota/runtime-version-check.txt"
          test -n "$BIN" && test "$BIN" = "$RES"
          echo "$BIN" > "$OUT/runtime-version.txt"
          for m in A B; do
            EXPO_PUBLIC_OTA_MARK=$m npx expo export --platform android --output-dir "/tmp/ota-export-$m"
            npx expo config --json --type public > "/tmp/ota-export-$m/expoConfig.json"
          done
          npm --prefix ../web/ota ci
          cd ../web/ota
          nohup npx --no-install wrangler dev --port 8787 --ip 127.0.0.1 --local > "$OUT/ota/wrangler.log" 2>&1 &
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8787/health && exit 0; sleep 2; done
          cat "$OUT/ota/wrangler.log"; exit 1
      - name: Enable KVM
        # As documented by reactivecircus/android-emulator-runner for Linux runners.
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screens and self test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/app/android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          # The action's defaults add -noaudio; the self test records from the emulated microphone.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          working-directory: app
          # The action runs each script line in its own shell, so all logic lives in the script.
          script: bash scripts/android-capture.sh
      - name: OTA smoke (embedded, update, tampered update, rollback, other channel)
        if: always() && steps.ota_prep.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/app/android/app/build/outputs/apk/release/app-release.apk
          PLATFORM: android
          EXPORT_A: /tmp/ota-export-A
          EXPORT_B: /tmp/ota-export-B
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -noaudio
          working-directory: app
          # One shell per line: the device reaches wrangler dev on the runner through the reverse tunnel.
          script: |
            adb wait-for-device
            adb reverse tcp:8787 tcp:8787
            bash scripts/ota-smoke.sh
      - name: Map symbols under another GPU mode (diagnostic)
        # Symbol layers did not draw under SwiftShader GLES in runs 1-2; the same APK on ANGLE-over-SwiftShader
        # (swangle) separates a renderer problem from an app problem. Map screen only.
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/app/android/app/build/outputs/apk/release/app-release.apk
          OUT: /tmp/app-android/gpu-swangle
          FULL: 0
          SCREENS: map
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -no-boot-anim -camera-back none -noaudio
          working-directory: app
          script: bash scripts/android-capture.sh
      - name: Compare with the SwiftUI references (fails below scripts/fidelity-thresholds.json)
        if: always()
        run: node scripts/compare.mjs --dir "$OUT/screens" --out "$OUT/compare" --json "$OUT/compare.json" --gate android
      - name: Keep the build log tail
        if: always()
        run: tail -n 300 "$OUT/build.log" > "$OUT/build-tail.log" 2>/dev/null || true
      - name: Upload screens, results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-android
          path: |
            /tmp/app-android
            !/tmp/app-android/build.log
          retention-days: 14
