name: RN spike

# React Native feasibility spike (spikes/kanaf-rn): Release builds for the iPad simulator and an Android tablet
# emulator, screenshots of each screen compared with the SwiftUI references, and the native self-test result.
# Build-and-capture only: nothing is signed for distribution, published or deployed.
on:
  push:
    branches: [spike/react-native]
    paths:
      - spikes/kanaf-rn/**
      - .github/workflows/rn-spike.yml
  workflow_dispatch:

concurrency:
  group: rn-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: spikes/kanaf-rn

jobs:
  ios:
    name: iOS (iPad simulator, Release)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Set at job level, before checkout: /usr/bin/git is an xcrun shim (see ci.yml). Same Xcode as ci.yml.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DD: /tmp/rn-dd
      OUT: /tmp/rn-spike-ios
    steps:
      - uses: actions/checkout@v7
      - name: Use the app's bundled aviation database (not committed in the spike)
        run: cp ../../efb-212/Resources/aviation.sqlite assets/aviation.sqlite
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spikes/kanaf-rn/package-lock.json
      - run: npm ci
      - name: Prebuild (ios)
        run: npx expo prebuild -p ios --no-install --clean
      - name: Pod install
        working-directory: spikes/kanaf-rn/ios
        run: pod install
      - name: Build Release for the simulator (ad-hoc signed)
        # Ad-hoc ("Sign to Run Locally") signing, no team: an unsigned app (CODE_SIGNING_ALLOWED=NO) gets
        # errSecMissingEntitlement from the Keychain, which broke expo-secure-store in run 2.
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          xcodebuild build -workspace ios/KanafRNSpike.xcworkspace -scheme KanafRNSpike -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DD" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            </dev/null 2>&1 | tee "$OUT/build.log" | xcbeautify --renderer github-actions
      - name: Show the app's signature and entitlements
        run: |
          APP="$DD/Build/Products/Release-iphonesimulator/KanafRNSpike.app"
          { grep -E '^(CodeSign|ProcessProductPackaging).*KanafRNSpike' "$OUT/build.log" || echo "no CodeSign step for the app in the build log"
            codesign -dvv "$APP" 2>&1 || true
            echo "--- signed entitlements"; codesign -d --entitlements - --xml "$APP" 2>&1 || true
            echo "--- simulated entitlements (__TEXT,__entitlements)"
            xcrun otool -X -s __TEXT __entitlements "$APP/KanafRNSpike" 2>&1 | head -40 || true
          } | tee "$OUT/signing.txt"
      - name: Capture screens and self test
        env:
          APP: /tmp/rn-dd/Build/Products/Release-iphonesimulator/KanafRNSpike.app
        run: scripts/ios-capture.sh
      - name: Compare with the SwiftUI references
        if: always()
        run: node scripts/compare.mjs --dir "$OUT/screens" --out "$OUT/compare" | tee "$OUT/compare.json"
      - name: Keep the build log tail
        if: always()
        run: tail -n 300 "$OUT/build.log" > "$OUT/build-tail.log" 2>/dev/null || true
      - name: Upload screens, results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rn-spike-ios
          path: |
            /tmp/rn-spike-ios
            !/tmp/rn-spike-ios/build.log
          retention-days: 14

  android:
    name: Android (Pixel Tablet API 35 emulator, Release)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUT: /tmp/rn-spike-android
    steps:
      - uses: actions/checkout@v7
      - name: Use the app's bundled aviation database (not committed in the spike)
        run: cp ../../efb-212/Resources/aviation.sqlite assets/aviation.sqlite
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spikes/kanaf-rn/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Prebuild (android)
        run: npx expo prebuild -p android --no-install --clean
      - name: Build Release APK (signed with the template's debug keystore)
        working-directory: spikes/kanaf-rn/android
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$OUT/build.log"
      - name: Enable KVM
        # As documented by reactivecircus/android-emulator-runner for Linux runners.
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screens and self test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/spikes/kanaf-rn/android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          # The action's defaults add -noaudio; the self test records from the emulated microphone.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          working-directory: spikes/kanaf-rn
          # The action runs each script line in its own shell, so all logic lives in the script.
          script: bash scripts/android-capture.sh
      - name: Map symbols under another GPU mode (diagnostic)
        # Symbol layers did not draw under SwiftShader GLES in runs 1-2; the same APK on ANGLE-over-SwiftShader
        # (swangle) separates a renderer problem from an app problem. Map screen only.
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/spikes/kanaf-rn/android/app/build/outputs/apk/release/app-release.apk
          OUT: /tmp/rn-spike-android/gpu-swangle
          FULL: 0
          SCREENS: map
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -no-boot-anim -camera-back none -noaudio
          working-directory: spikes/kanaf-rn
          script: bash scripts/android-capture.sh
      - name: Compare with the SwiftUI references
        if: always()
        run: node scripts/compare.mjs --dir "$OUT/screens" --out "$OUT/compare" | tee "$OUT/compare.json"
      - name: Keep the build log tail
        if: always()
        run: tail -n 300 "$OUT/build.log" > "$OUT/build-tail.log" 2>/dev/null || true
      - name: Upload screens, results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rn-spike-android
          path: |
            /tmp/rn-spike-android
            !/tmp/rn-spike-android/build.log
          retention-days: 14
