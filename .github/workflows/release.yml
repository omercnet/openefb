name: Release

# release-please keeps a release pull request open from the Conventional Commits on main. Merging it tags vX.Y.Z,
# publishes the GitHub release, and the testflight job uploads that version to TestFlight (see docs/CI.md).
# Run it by hand (workflow_dispatch) to upload a release tag again, or with upload off to check signing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (vX.Y.Z); required when uploading
        type: string
        default: ""
      upload:
        description: Upload to TestFlight (off = archive and sign only)
        type: boolean
        default: true
      build_number:
        description: Build number (default = commit count; use a higher one to retry after Apple accepted an upload)
        type: string
        default: ""

# Pending runs queue in order (queue: max) so a manual run never cancels the push run that tags a release.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # release labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A pull request opened with GITHUB_TOKEN doesn't trigger CI, so the required "CI gate" never reports.
          # RELEASE_PLEASE_TOKEN (fine-grained PAT: contents + pull requests, read/write) fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  testflight:
    name: TestFlight upload
    needs: release-please
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer # same pin as ci.yml
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
    steps:
      # An upload builds a release tag: the one release-please just created, or the `tag` input of a manual run.
      # A manual sign-only run (upload off, no tag) builds the commit it was dispatched at.
      - name: Resolve what to build
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_UPLOAD: ${{ inputs.upload }}
        run: |
          upload=true
          [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_UPLOAD" = false ] && upload=false
          tag=${RELEASE_TAG:-$INPUT_TAG}
          if [ -n "$tag" ]; then
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$tag' is not vX.Y.Z"; exit 1; }
            git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$tag" >/dev/null \
              || { echo "::error::tag $tag does not exist"; exit 1; }
            { echo "ref=refs/tags/$tag"; echo "version=${tag#v}"; } >> "$GITHUB_OUTPUT"
          elif [ "$upload" = false ]; then
            { echo "ref=$GITHUB_SHA"; echo "version="; } >> "$GITHUB_OUTPUT"
          else
            echo "::error::an upload needs a release tag: set the tag input (vX.Y.Z), or turn upload off"; exit 1
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0 # the build number is the commit count
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Archive, sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
          VERSION: ${{ steps.target.outputs.version }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
          TESTFLIGHT_CHANGELOG: ${{ needs.release-please.outputs.body }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          UPLOAD: ${{ steps.target.outputs.upload }}
        run: bundle exec fastlane ios beta "upload:$UPLOAD"
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-logs
          path: ~/Library/Logs/gym
          retention-days: 7
